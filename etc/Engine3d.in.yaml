---
# Default configuration for the Engine3d mc_rtc plugin.
#
# Load the plugin by adding it to the host configuration:
#   Plugins: [Engine3d]
# then override any of the keys below from an "Engine3d" section of that same
# configuration.

# Point cloud (.pts/.bin) or mesh (.obj/.oct) rendered in the scene
# mesh_model: "/path/to/scene.obj"

# Rendering and stream publishing run on their own thread so a heavy scene never
# delays the control step. render_rate caps that thread in Hz
# (0 = render as fast as possible). Default: 30
render_rate: 30

# Main camera: configured in place on the engine, its stream is published on the
# "MainCamera" image_transport topic.
MainCamera:
  frame: "tool0"
  size: [250, 250]
  projection_type: 0
  intrinsics: [256.2125, 195.201, 244.61375, 244.52125]

# Additional cameras: each one is added to the engine and streamed on a topic
# named after "name". Every camera is rendered on each engine.takePicture().
Cameras:
  - name: "Camera1"
    frame: "tool0"
    size: [320, 240]
    projection_type: 0
    intrinsics: [256.0, 195.0, 160.0, 120.0]
    # Optional per-camera settings
    # near_plane: 0.1
    # far_plane: 1000.0
    # samples: 4
    # background_color: [0.5, 0.5, 0.5]
    # save_path: "/tmp"   # also dump every frame to <save_path>/<name>.png
