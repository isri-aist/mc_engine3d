---
MainRobot: UR5e
Enabled: [Posture]

Engine3d:
  # Point cloud (.pts/.bin) or mesh (.obj) rendered in the scene
  mesh_model: "/home/tduvinage/Dependencies/Engine3D/examples/MultiCamera/Model/Suzanne.obj"

  # Main camera: configured in place on the engine, its stream is published on
  # the "MainCamera" image_transport topic.
  MainCamera:
    frame: "tool0"
    size: [250, 250]
    projection_type: 0
    intrinsics: [256.2125, 195.201, 244.61375, 244.52125]

  # Additional cameras: each one is added to the engine and streamed on a topic
  # named after "name". Every camera is rendered on each engine.takePicture().
  Cameras:
    - name: "Camera1"
      frame: "tool0"
      size: [320, 240]
      projection_type: 0
      intrinsics: [256.0, 195.0, 160.0, 120.0]
    - name: "Camera2"
      frame: "tool0"
      size: [640, 480]
      projection_type: 1
      intrinsics: [512.0, 390.0, 320.0, 240.0]
      # Optional per-camera settings
      # near_plane: 0.1
      # far_plane: 1000.0
      # samples: 4
      # background_color: [0.5, 0.5, 0.5]
      # save_path: "/tmp"   # also dump every frame to <save_path>/<name>.png
